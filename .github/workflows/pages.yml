name: Deploy to GitHub Pages

on:
  # Publish only from main (or a manual run). Pushing feature branches such as
  # fix/wire-up-app must not deploy.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (pnpm@9.12.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Node version comes from .nvmrc. Node 20 cannot run the tests:
      # jsdom 30 -> undici 8 requires Node >= 22.19.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Read at build time by src/app/demo.ts (import.meta.env.VITE_DEMO === '1').
          # Vite inlines it into the bundle, so it must be set on this step.
          VITE_DEMO: '1'
          # Vite base path = /<repository name>/ so assets resolve on
          # https://<owner>.github.io/<repository name>/ (read in vite.config.ts).
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
